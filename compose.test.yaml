# Databases for the integration tests: `scripts/test-databases.sh up`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: herdr_db_test
    ports: ["55432:5432"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: herdr_db_test
    ports: ["53306:3306"]
